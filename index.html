<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="赵培涵的房间。作品、研究，和一些对生活的好奇。">
  <meta name="theme-color" content="#f3efe6">
  <title>一间属于自己的房间 · 赵培涵</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="revisions.css">
  <link rel="icon" href="assets/original-03.png">
  <script src="profile.js" defer></script>
  <script src="content.js" defer></script>
  <script src="room-templates.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-view="gate">
  <div class="paper-grain" aria-hidden="true"></div>
  <section class="entrance" id="entrance" aria-label="门厅">
    <header class="entrance-top"><span>赵培涵 <i>培根</i></span><span class="latin">A Room of One’s Own</span></header>
    <div class="entrance-copy"><p class="eyebrow">你好，欢迎来坐坐。</p><h1>一间属于<br>自己的<span>房间</span></h1><p class="entrance-note">对人的生活有好奇，<br>对把事情做好有耐心。</p></div>
    <button class="entrance-door" id="enter" aria-label="推门进入走廊">
      <span class="door-recess"></span><span class="entrance-leaf"><svg viewBox="0 0 120 206" aria-hidden="true"><use href="assets/doors.svg#d-gate"/></svg><span class="gate-name">培根的房间</span><span class="gate-knob"></span></span>
      <span class="enter-label">推门 <span>↗</span></span>
    </button>
    <footer class="entrance-footer"><span>作品、研究，和生活的另一面。</span><span class="latin">Make yourself at home.</span></footer>
  </section>

  <main id="house" inert aria-label="走廊">
    <div class="corridor-stage" id="stage">
      <div class="ground" aria-hidden="true"><div class="floor-lines"></div><div class="horizon-light"></div></div>
      <div class="world" id="world"><div class="wall wall-left" id="wall-left"><div class="wall-top"></div><div class="wall-base"></div></div><div class="wall wall-right" id="wall-right"><div class="wall-top"></div><div class="wall-base"></div></div><div class="end-wall"><button class="end-window" data-room="window" aria-label="打开飘窗"><svg viewBox="0 0 120 176" aria-hidden="true"><use href="assets/doors.svg#d-window"/></svg></button></div></div>
      <div class="door-labels" id="door-labels"></div>
      <div class="corridor-address"><span class="latin">You are here.</span><span id="nearby">客厅</span></div>
    </div>
    <header class="house-header"><button id="home" class="wordmark">培根的房间<span class="latin">Bacon’s</span></button><div class="header-actions"><button id="room-menu-button" aria-expanded="false" aria-controls="room-menu">房间 <span>＋</span></button><button id="motion-toggle" aria-pressed="false" aria-label="减少动态效果">静一静</button><button id="theme-toggle" aria-label="切换夜晚">夜晚</button></div></header>
    <nav class="room-menu" id="room-menu" aria-label="房间目录" hidden></nav>
    <nav class="corridor-bottom" aria-label="走廊导航"><button id="previous-door" aria-label="往回走">←</button><div class="corridor-progress"><div id="progress"></div></div><span>滚动，往前走</span><button id="next-door" aria-label="往前走">→</button></nav>
    <div class="scroll-track" id="track"></div>
  </main>

  <section class="room-view" id="room-view" hidden aria-label="房间内容">
    <header class="room-header"><button id="back-corridor">← 走廊</button><span id="room-current"></span><div><button id="previous-room" aria-label="上一间房">←</button><button id="next-room" aria-label="下一间房">→</button></div></header>
    <div id="room-content"></div>
  </section>

  <div class="pet-wrap" id="pet-wrap" hidden><div class="pet-speech" id="pet-speech" hidden><button data-pet-go="archive">带我看作品</button><button data-pet-go="window">去窗边坐坐</button><button id="hide-pet">让小蓝休息</button></div><button class="pet" id="pet" aria-label="小蓝，点击让她带路"><span class="pet-sprite" id="pet-sprite"></span></button><span class="pet-shadow" aria-hidden="true"></span></div>
  <button id="restore-pet" hidden>小蓝</button>
  <dialog id="image-viewer" aria-label="查看作品原图"><header><span id="image-title"></span><button id="close-image" aria-label="关闭图片">✕</button></header><div class="image-scroll"><img id="full-image" alt=""></div></dialog>
  <dialog id="dossier-viewer" aria-labelledby="dossier-title"><header class="dossier-header"><div><span id="dossier-meta"></span><h1 id="dossier-title"></h1></div><button id="close-dossier" aria-label="收起档案">✕</button></header><div id="dossier-body" class="dossier-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">赵培涵 · 华东师范大学社会工作硕士在读。<a href="mailto:bacon_zhao@163.com">bacon_zhao@163.com</a> · 13777433852<p>请开启 JavaScript 进入房间。</p></div></noscript>
</body>
</html>
